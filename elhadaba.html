  <style>
    /* ===== the look of the page ===== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #212121;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* top bar with the name */
    header {
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: #171717;
      border-bottom: 1px solid #333;
    }

    /* the area where the messages show up */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* every message bubble */
    .msg {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    /* my messages go on the right (green) */
    .user {
      align-self: flex-end;
      background: #10a37f;
    }

    /* bot messages go on the left (grey) */
    .bot {
      align-self: flex-start;
      background: #2f2f2f;
    }

    /* the little "typing..." bubble */
    .typing {
      opacity: 0.6;
      font-style: italic;
    }

    /* the bottom part with the input box */
    #inputArea {
      display: flex;
      padding: 15px;
      background: #171717;
      border-top: 1px solid #333;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      background: #2f2f2f;
      color: white;
      outline: none;
    }

    button {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background: #10a37f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0d8a6a;
    }

    /* on a phone the bubbles can be wider */
    @media (max-width: 600px) {
      .msg { max-width: 85%; }
    }
  </style>
</head>

    // ================================
    //  helper functions
    // ================================

    // picks a random thing from a list
    function random(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // squashes repeated letters so "hiii" becomes "hi"
    function squash(text) {
      return text.replace(/(.)\1+/g, "$1");
    }

    // checks if a keyword is in the text as a WHOLE word
    // (so "hi" doesn't match inside "think")
    function matches(text, key) {
      // escape any special characters so the regex doesn't break
      var safeKey = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

      // for normal words also accept the plural, so "loop" matches "loops"
      if (key.length >= 4 && key.indexOf(" ") === -1) {
        safeKey = safeKey + "s?";
      }

      return new RegExp("\\b" + safeKey + "\\b").test(text);
    }

    // puts a message bubble on the screen
    function addMessage(text, who, extraClass) {
      var bubble = document.createElement("div");
      bubble.className = "msg " + who + (extraClass ? " " + extraClass : "");
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;   // scroll to the bottom
      return bubble;
    }

    // checks if the message looks like an idea or an opinion
    function isIdea(text) {
      var ideaWords = ["idea", "i think", "what if", "my plan", "should i", "i want to",
                       "i made", "i built", "i created", "what do you think", "i am going to",
                       "im going to", "i'm going to"];
      for (var i = 0; i < ideaWords.length; i++) {
        if (text.indexOf(ideaWords[i]) !== -1) return true;
      }
      return false;
    }

    // checks if the message looks like a question
    function isQuestion(text) {
      if (text.indexOf("?") !== -1) return true;
      var questionWords = ["what", "why", "how", "who", "when", "where", "which",
                           "is ", "are ", "can ", "do ", "does ", "tell me"];
      for (var i = 0; i < questionWords.length; i++) {
        if (text.indexOf(questionWords[i]) === 0) return true;
      }
      return false;
    }

    // ================================
    //  maths - understands symbols AND words
    //  so "10 + 10" and "10 plus 10" both work
    // ================================
    function doMath(text) {
      var sum = text;

      // turn the words into maths symbols
      sum = sum.replace(/\bplus\b|\badd\b|\badded to\b/g, "+");
      sum = sum.replace(/\bminus\b|\btake away\b|\bsubtract\b/g, "-");
      sum = sum.replace(/\btimes\b|\bmultiplied by\b|\bmultiply\b|\bx\b/g, "*");
      sum = sum.replace(/\bdivided by\b|\bdivide\b|\bover\b/g, "/");

      // "20% of 50"
      var percent = sum.match(/(\d+(\.\d+)?)\s*%\s*of\s*(\d+(\.\d+)?)/);
      if (percent) {
        var part = (Number(percent[1]) / 100) * Number(percent[3]);
        return percent[1] + "% of " + percent[3] + " is " + part + " 🧮";
      }

      // "square root of 16"
      var root = sum.match(/square root of\s*(\d+(\.\d+)?)/);
      if (root) {
        return "The square root of " + root[1] + " is " + Math.sqrt(Number(root[1])) + " 🧮";
      }

      // keep only numbers and maths symbols so nothing weird can run
      var clean = sum.replace(/[^0-9+\-*/(). ]/g, "");

      // it needs two numbers and a symbol before it counts as a sum
      var numbers = clean.match(/\d+(\.\d+)?/g);
      if (!numbers || numbers.length < 2) return null;
      if (!/[+\-*/]/.test(clean)) return null;

      try {
        var result = Function("return (" + clean + ")")();
        if (typeof result !== "number" || !isFinite(result)) return null;
        result = Math.round(result * 10000) / 10000;   // tidy up long decimals
        return "That's " + result + " 🧮";
      } catch (e) {
        return null;
      }
    }

    // ================================
    //  COUNTRIES AND CITIES
    // ================================

    // finds which country or city the message is talking about.
    // the longest name wins, so "south korea" beats "korea"
    function findPlace(text, list) {
      var best = null;
      var bestLength = 0;
      for (var i = 0; i < list.length; i++) {
        for (var j = 0; j < list[i].names.length; j++) {
          var name = list[i].names[j];
          if (name.length > bestLength && matches(text, name)) {
            best = list[i];
            bestLength = name.length;
          }
        }
      }
      return best;
    }

    // works out what you actually want to know about a country
    function answerAboutCountry(text, c) {
      if (text.indexOf("capital") !== -1) {
        return "The capital of " + c.title + " is " + c.capital + " " + c.flag;
      }
      if (text.indexOf("language") !== -1 || text.indexOf("speak") !== -1) {
        return "In " + c.title + " they speak " + c.language + " " + c.flag;
      }
      if (text.indexOf("currency") !== -1 || text.indexOf("money") !== -1) {
        return "The currency of " + c.title + " is the " + c.money + " " + c.flag;
      }
      if (text.indexOf("population") !== -1 || text.indexOf("how many people") !== -1) {
        return c.title + " has " + c.people + " people " + c.flag;
      }
      if (text.indexOf("continent") !== -1 || text.indexOf("where is") !== -1) {
        return c.title + " is in " + c.continent + " " + c.flag;
      }
      if (text.indexOf("fact") !== -1 || text.indexOf("interesting") !== -1) {
        return c.fact + " " + c.flag;
      }
      // no specific question, so give the full summary
      return c.title + " " + c.flag + " is in " + c.continent + ". The capital is " + c.capital +
             ", they speak " + c.language + ", the currency is the " + c.money +
             ", and there are " + c.people + " people. Fun fact: " + c.fact + ".";
    }

    // same idea but for cities
    function answerAboutCity(text, city) {
      if (text.indexOf("country") !== -1 || text.indexOf("where is") !== -1) {
        return city.title + " is a city in " + city.country + " " + city.flag;
      }
      if (text.indexOf("fact") !== -1 || text.indexOf("interesting") !== -1) {
        return city.fact + " " + city.flag;
      }
      return city.title + " " + city.flag + " is a city in " + city.country + ". " + city.fact + ".";
    }

    // makes the first letter a capital, so "the UAE" becomes "The UAE"
    function capitalise(text) {
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    // checks countries first, then cities
    function talkAboutPlaces(text) {
      var country = findPlace(text, countries);
      if (country) return capitalise(answerAboutCountry(text, country));

      var city = findPlace(text, cities);
      if (city) return capitalise(answerAboutCity(text, city));

      return null;
    }

    // looks through the brain for a matching keyword
    // "loose" means squash repeated letters on both sides,
    // so "helloo" can still find "hello"
    function searchBrain(text, loose) {
      for (var i = 0; i < brain.length; i++) {
        for (var j = 0; j < brain[i].keys.length; j++) {
          var key = loose ? squash(brain[i].keys[j]) : brain[i].keys[j];
          if (matches(text, key)) {
            var answer = brain[i].answer;
            // some answers are functions (like the time), so run them
            return typeof answer === "function" ? answer() : answer;
          }
        }
      }
      return null;
    }

    // ================================
    //  the main thinking part
    // ================================
    function getReply(userText) {
      var text = userText.toLowerCase().trim();
      var reply = "";

      // 1. if it's an idea, praise it first
      if (isIdea(text)) {
        reply += random(praise) + " ";
      }

      // 2. is it a sum?
      var mathAnswer = doMath(text);
      if (mathAnswer) return reply + mathAnswer;

      // 3. is it about a country or a city?
      var place = talkAboutPlaces(text);
      if (place) {
        var placeStarter = (reply === "" && isQuestion(text)) ? random(starters) : "";
        return reply + placeStarter + place;
      }

      // 4. normal keyword search
      var found = searchBrain(text);

      // 5. try again with repeated letters squashed, so "helloo" finds "hello"
      if (found === null) {
        found = searchBrain(squash(text), true);
      }

      if (found !== null) {
        // only add an opener if it's a question and we haven't praised already
        var starter = (reply === "" && isQuestion(text)) ? random(starters) : "";
        return reply + starter + found;
      }

      // 6. it was an idea but nothing matched
      if (reply !== "") {
        return reply + "Tell me more about it, I'd love to hear the details!";
      }

      // 7. no clue at all
      return random(noClue) + " Try asking me about a country or a city, or about coding, science, maths or school. I can do sums too, like 10 plus 10 🙂";
    }

    // ================================
    //  sending a message
    // ================================
    function sendMessage() {
      var userText = input.value.trim();
      if (userText === "") return;   // ignore empty messages

      addMessage(userText, "user");
      input.value = "";
      input.focus();

      // show a little "typing..." bubble so it feels real
      var typingBubble = addMessage("typing...", "bot", "typing");

      setTimeout(function() {
        chat.removeChild(typingBubble);
        try {
          addMessage(getReply(userText), "bot");
        } catch (err) {
          // if something breaks, show it instead of doing nothing
          addMessage("Oops, something went wrong: " + err.message, "bot");
        }
      }, 600);
    }

    // click the Send button
    sendBtn.addEventListener("click", sendMessage);

    // or just press Enter
    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.keyCode === 13) {
        event.preventDefault();
        sendMessage();
      }
    });

    // first message when the page opens
    addMessage("Hey! I'm Elhadaba 🤖 Ask me anything or tell me your ideas!", "bot");
  </script>
</body>
</html>
