<style>
:root{--page:#eceef3;--paper:#fff;--ink:#151515;--muted:#5f6475;--blue:#1f33a6;--hair:#dfe3f2;--tint:#f3f5fc;color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:Poppins,Tajawal,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding:max(28px,env(safe-area-inset-top,0px)) 16px max(28px,env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
ul{list-style:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.ar{font-family:Tajawal,system-ui,sans-serif}
.card{max-width:390px;margin:0 auto;padding:34px 24px 54px;background:var(--paper);border-radius:20px;text-align:center}
.logo{width:202px;max-width:100%;height:auto;display:block;margin:0 auto}
.name{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:27px;line-height:1.2;letter-spacing:.01em;margin-top:28px}
.strip{display:block;margin:26px 0 6px}
.rows{text-align:left}
.rows li a{display:flex;align-items:center;gap:20px;padding:15px 4px;border-bottom:1px solid var(--hair);transition:background-color .15s}
.rows li:last-child a{border-bottom:0}
.rows li a:active{background:var(--tint)}
@media (hover:hover){.rows li a:hover{background:var(--tint)}}
.rows svg{width:22px;height:22px;color:var(--blue);flex:none;margin-left:4px}
.rows .txt{flex:1;min-width:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;color:var(--muted)}
.lab .ar{font-size:14.5px}
.val{display:block;font-size:16px;margin-top:1px;overflow-wrap:anywhere}
/* A plain link to the .vcf file is the most reliable way to add a contact:
   iPhone opens the "Create New Contact" screen, Android opens it in Contacts. */
.save{display:inline-block;margin-top:34px;padding:12px 40px 10px;border:1px solid var(--blue);line-height:1.45;transition:background-color .15s,color .15s}
.save:active{background:var(--blue);color:#fff}
@media (hover:hover){.save:hover{background:var(--blue);color:#fff}}
.save .en{display:block;font-size:14.5px;letter-spacing:.02em}
.save .ar{display:block;font-size:16px}
</style>
</head>
